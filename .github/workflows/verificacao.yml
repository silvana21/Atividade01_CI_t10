name: Validação do Projeto
on:
  push:
  pull_request:
    branches: [main]

jobs:
  verificar-projeto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Informações do repositório
        run: |
          echo "Repositório: ${{ github.repository }}"
          echo "Usuário: ${{ github.actor }}"

      - name: Listar arquivos
        run: ls -la

      - name: Verificar README
        run: |
          if [ -f README.md ]; then
            echo "README.md encontrado!"
          else
            echo "ERRO: README.md não encontrado!"
            exit 1
          fi

      - name: Finalizar validação
        run: echo "Validação concluída com sucesso!"