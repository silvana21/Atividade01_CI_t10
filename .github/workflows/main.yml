name: Validação do Projeto

on:
  push:            # sem filtro de branches: dispara em qualquer push

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Exibir repositório e usuário
        run: |
          echo "Repositório: ${{ github.repository }}"
          echo "Iniciado por: ${{ github.actor }}"

      - name: Verificar se README.md existe
        run: |
          if [ -f "README.md" ]; then
            echo "README.md encontrado."
          else
            echo "ERRO: o arquivo README.md não existe."
            exit 1
          fi

      - name: Mensagem de conclusão
        run: echo "Validação do Projeto concluída com sucesso."
